<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="David Soard — business, music, technology, and life.">
  <title>David Soard | Business • Music • Life</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/script.js" defer></script>
  <style>
    body.landing #landing-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      gap: 3rem;
    }
    
    body.landing header {
      text-align: center;
      max-width: 600px;
    }
    
    body.landing header h1 {
      font-size: 3rem;
      margin-bottom: 1rem;
      line-height: 1.2;
    }
    
    body.landing header p {
      font-size: 1.2rem;
      color: var(--muted);
      margin: 0;
    }
    
    body.landing #portal-buttons {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 2rem;
      width: 100%;
      max-width: 1000px;
      margin: 0;
    }
    
    body.landing #portal-buttons .portal-btn {
      padding: 2rem;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--bg), rgba(92, 141, 255, 0.1));
      border: 1px solid var(--accent);
      color: var(--text);
      text-decoration: none;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      cursor: pointer;
      font-size: 1.1rem;
      font-weight: 600;
    }
    
    body.landing #portal-buttons .portal-btn:hover {
      background: linear-gradient(135deg, rgba(92, 141, 255, 0.2), rgba(92, 141, 255, 0.15));
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(92, 141, 255, 0.2);
      border-color: #7da3ff;
    }
    
    body.landing #portal-buttons .portal-btn::before {
      content: attr(data-label);
      font-size: 0.85rem;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
  </style>
</head>
<body class="landing">
  <div id="landing-container">
    <header>
      <h1>David Soard</h1>
      <p>Explore business analysis, music & entertainment, and personal projects.</p>
    </header>

    <div id="portal-buttons">
      <a href="business/index.html" class="portal-btn" data-label="→ Business">Business</a>
      <a href="music/index.html" class="portal-btn" data-label="→ Music">Music & Entertainment</a>
      <a href="personal/index.html" class="portal-btn" data-label="→ Personal">Personal</a>
    </div>
  </div>

  <footer>&copy; 2025 David Soard. All rights reserved.</footer>
</body>
</html>
